<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ID HUB | Conheça seus alunos. Transforme o ensino.</title>
  
  <!-- Google Fonts: Inter & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome para Ícones Profissionais -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- =========================================
       ESTILOS CSS INTEGRADOS
  ========================================= -->
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0d2b24 0%, #164e41 50%, #2d6a4f 100%);
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.15);
      --text-primary: #ffffff;
      --text-secondary: #d8f3dc;
      --accent-color: #52b788;
      --accent-hover: #74c69d;
      --btn-bg: rgba(255, 255, 255, 0.12);
      --btn-hover-bg: rgba(255, 255, 255, 0.22);
      --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.35);
      --font-main: 'Inter', sans-serif;
      --font-title: 'Poppins', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-main);
      background: var(--bg-gradient);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Container Principal (Glassmorphism) */
    .app-container {
      position: relative;
      width: 100%;
      max-width: 1050px;
      min-height: 600px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 50px;
      overflow: hidden;
      animation: fadeIn 0.8s ease-out;
    }

    /* Ondas Decorativas */
    .wave-bg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 220px;
      z-index: 0;
      pointer-events: none;
    }

    .wave-bg svg {
      width: 100%;
      height: 100%;
    }

    /* Cabeçalho / Logo */
    .header {
      position: relative;
      z-index: 2;
      margin-bottom: 30px;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: var(--accent-color);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: #0d2b24;
      box-shadow: 0 4px 15px rgba(82, 183, 136, 0.4);
    }

    .logo-text {
      font-family: var(--font-title);
      font-size: 1.8rem;
      letter-spacing: 1px;
      color: var(--text-primary);
    }

    /* Grid do Conteúdo */
    .content-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1.1f 1fr;
      align-items: center;
      gap: 40px;
      margin-top: auto;
      margin-bottom: auto;
    }

    /* Textos e Slogan */
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: rgba(82, 183, 136, 0.2);
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: 50px;
      margin-bottom: 16px;
      border: 1px solid rgba(82, 183, 136, 0.3);
    }

    .hero-text h1 {
      font-family: var(--font-title);
      font-size: 3.8rem;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 20px;
      background: linear-gradient(to right, #ffffff, #b7e4c7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .slogan {
      font-size: 1.35rem;
      font-weight: 400;
      line-height: 1.5;
      color: var(--text-secondary);
    }

    .slogan span {
      font-weight: 600;
      color: #ffffff;
      border-bottom: 2px solid var(--accent-color);
    }

    /* Botões de Ação */
    .nav-actions {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      max-width: 380px;
      justify-self: end;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--btn-bg);
      border: 1px solid var(--card-border);
      padding: 12px 16px;
      border-radius: 50px;
      text-decoration: none;
      color: var(--text-primary);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      overflow: hidden;
    }

    .action-btn:hover {
      background: var(--btn-hover-bg);
      border-color: var(--accent-color);
      transform: translateX(8px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    .icon-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .action-btn:hover .icon-circle {
      background: var(--accent-color);
      color: #0d2b24;
      transform: rotate(-45deg);
    }

    .btn-content {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-title);
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .btn-icon {
      font-size: 1.1rem;
      color: var(--text-secondary);
    }

    /* Responsividade (Celulares e Tablets) */
    @media (max-width: 850px) {
      .app-container {
        padding: 30px 24px;
        min-height: auto;
      }

      .content-grid {
        grid-template-columns: 1fr;
        gap: 36px;
        text-align: center;
      }

      .hero-text h1 {
        font-size: 2.8rem;
      }

      .nav-actions {
        justify-self: center;
        width: 100%;
      }

      .action-btn:hover {
        transform: translateY(-3px);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <main class="app-container">
    <!-- Fundo decorativo com ondas modernas -->
    <div class="wave-bg">
      <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
        <path fill="rgba(255, 255, 255, 0.08)" d="M0,192L48,197.3C96,203,192,213,288,192C384,171,480,117,576,117.3C672,117,768,171,864,197.3C960,224,1056,224,1152,197.3C1248,171,1344,117,1392,90.7L1440,64L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
        <path fill="rgba(15, 62, 51, 0.35)" d="M0,224L60,213.3C120,203,240,181,360,186.7C480,192,600,224,720,218.7C840,213,960,171,1080,165.3C1200,160,1320,192,1380,208L1440,224L1440,320L1380,320C1320,320,1200,320,1080,320C960,320,840,320,720,320C600,320,480,320,360,320C240,320,120,320,60,320L0,320Z"></path>
      </svg>
    </div>

    <!-- Cabeçalho / Logo -->
    <header class="header">
      <div class="logo-group">
        <div class="logo-icon">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <span class="logo-text">ID<strong>HUB</strong></span>
      </div>
    </header>

    <!-- Conteúdo Principal -->
    <div class="content-grid">
      
      <!-- Lado Esquerdo: Mensagem de Boas-vindas -->
      <section class="hero-text">
        <span class="badge">Gestão Educacional Inteligente</span>
        <h1>Bem-vindo!</h1>
        <p class="slogan">
          Conheça seus alunos. <br>
          <span>Transforme o ensino.</span>
        </p>
      </section>

      <!-- Lado Direito: Botões de Navegação -->
      <nav class="nav-actions" aria-label="Menu principal">
        
        <a href="login.html" class="action-btn ripple">
          <div class="icon-circle">
            <i class="fa-solid fa-arrow-right"></i>
          </div>
          <div class="btn-content">
            <i class="fa-solid fa-user btn-icon"></i>
            <span>Login</span>
          </div>
        </a>

        <a href="cadastro.html" class="action-btn ripple">
          <div class="icon-circle">
            <i class="fa-solid fa-arrow-right"></i>
          </div>
          <div class="btn-content">
            <i class="fa-solid fa-user-plus btn-icon"></i>
            <span>Cadastro</span>
          </div>
        </a>

        <a href="sobre.html" class="action-btn ripple">
          <div class="icon-circle">
            <i class="fa-solid fa-arrow-right"></i>
          </div>
          <div class="btn-content">
            <i class="fa-solid fa-circle-info btn-icon"></i>
            <span>Sobre o IDHUB</span>
          </div>
        </a>

      </nav>

    </div>
  </main>

  <!-- =========================================
       JAVASCRIPT INTEGRADO
  ========================================= -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Efeito "Ripple" visual ao clicar no botão
      const buttons = document.querySelectorAll('.ripple');

      buttons.forEach(button => {
        button.addEventListener('click', function (e) {
          const rect = this.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;

          const circle = document.createElement('span');
          circle.style.position = 'absolute';
          circle.style.top = `${y}px`;
          circle.style.left = `${x}px`;
          circle.style.width = circle.style.height = '100px';
          circle.style.background = 'rgba(255, 255, 255, 0.3)';
          circle.style.borderRadius = '50%';
          circle.style.transform = 'translate(-50%, -50%) scale(0)';
          circle.style.pointerEvents = 'none';
          circle.style.transition = 'transform 0.5s ease, opacity 0.5s ease';

          this.appendChild(circle);

          requestAnimationFrame(() => {
            circle.style.transform = 'translate(-50%, -50%) scale(3)';
            circle.style.opacity = '0';
          });

          setTimeout(() => {
            circle.remove();
          }, 500);
        });
      });

      // 2. Animação progressiva de entrada dos botões (Stagger Effect)
      const navItems = document.querySelectorAll('.action-btn');
      navItems.forEach((item, index) => {
        item.style.opacity = '0';
        item.style.transform = 'translateX(-20px)';
        item.style.transition = 'all 0.4s ease';

        setTimeout(() => {
          item.style.opacity = '1';
          item.style.transform = 'translateX(0)';
        }, 200 + (index * 120));
      });
    });
  </script>
</body>
</html>
